<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Painel Admin | Tozzi Materiais Elétricos</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-slate-800 rounded-xl shadow-2xl border border-slate-700 p-8">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-amber-500">TOZZI</h1>
      <p class="text-xs tracking-widest text-slate-400 uppercase">Materiais Elétricos - Cerquilho</p>
      <h2 class="text-lg font-semibold mt-4 text-white">Acesso Administrativo</h2>
    </div>

    <!-- Alertas -->
    <div id="alertBox" class="hidden mb-4 p-3 rounded-lg text-sm text-center font-medium"></div>

    <form id="loginForm" class="space-y-5">
      <div>
        <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Usuário</label>
        <input type="text" id="username" required
               class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-amber-500 transition-colors">
      </div>

      <div>
        <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Senha</label>
        <input type="password" id="password" required
               class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-amber-500 transition-colors">
      </div>

      <button type="submit" id="btnSubmit"
              class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-lg transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed">
        Entrar no Painel
      </button>
    </form>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const alertBox = document.getElementById('alertBox');
    const btnSubmit = document.getElementById('btnSubmit');

    let failedAttempts = 0;
    let lockTimeout = null;

    function showAlert(msg, isError = true) {
      alertBox.classList.remove('hidden', 'bg-red-500/10', 'text-red-400', 'border-red-500/20', 'bg-amber-500/10', 'text-amber-400', 'border-amber-500/20');
      if (isError) {
        alertBox.classList.add('bg-red-500/10', 'text-red-400', 'border', 'border-red-500/20');
      } else {
        alertBox.classList.add('bg-amber-500/10', 'text-amber-400', 'border', 'border-amber-500/20');
      }
      alertBox.innerText = msg;
    }

    function applyFrontendCooldown(seconds) {
      btnSubmit.disabled = true;
      let remaining = seconds;
      
      const updateText = () => {
        showAlert(`Acesso bloqueado por muitas tentativas. Aguarde ${remaining}s.`, true);
      };

      updateText();
      const interval = setInterval(() => {
        remaining--;
        if (remaining <= 0) {
          clearInterval(interval);
          btnSubmit.disabled = false;
          alertBox.classList.add('hidden');
          failedAttempts = 0;
        } else {
          updateText();
        }
      }, 1000);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      try {
        btnSubmit.disabled = true;
        btnSubmit.innerText = 'Autenticando...';

        const response = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok) {
          window.location.href = '/admin/dashboard.html';
        } else if (response.status === 429) {
          applyFrontendCooldown(15 * 60); // Cooldown do Servidor (15m)
        } else {
          failedAttempts++;
          showAlert(data.error || 'Falha na autenticação.');
          
          if (failedAttempts >= 3) {
            applyFrontendCooldown(60); // Cooldown temporário de 1m no Frontend ao atingir localmente 3 erros
          }
        }
      } catch (err) {
        showAlert('Erro de conexão com o servidor.');
      } finally {
        if (!btnSubmit.disabled) {
          btnSubmit.disabled = false;
          btnSubmit.innerText = 'Entrar no Painel';
        }
      }
    });
  </script>
</body>
</html>
