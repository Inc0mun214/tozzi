<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Painel Admin | Tozzi Materiais Elétricos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

  <div class="w-full max-w-md bg-slate-900 rounded-2xl shadow-2xl border border-slate-800 p-8">
    
    <!-- Logo e Título Esverdeado -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center gap-2 bg-emerald-500 text-slate-950 font-black text-2xl px-4 py-1 rounded-xl mb-2 shadow-lg shadow-emerald-500/20">
        <i class="fa-solid fa-bolt"></i> TOZZI
      </div>
      <p class="text-xs tracking-widest text-slate-400 uppercase font-medium">Materiais Elétricos - Cerquilho & Tietê</p>
      <h2 class="text-lg font-bold mt-4 text-white">Acesso Administrativo</h2>
    </div>

    <!-- Alertas de Erro / Cooldown -->
    <div id="alertBox" class="hidden mb-5 p-3.5 rounded-xl text-sm text-center font-medium border transition-all"></div>

    <form id="loginForm" class="space-y-5">
      <div>
        <label class="block text-xs uppercase font-bold text-slate-400 mb-1.5">Usuário</label>
        <input type="text" id="username" required placeholder="admin"
               class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 transition-colors text-sm">
      </div>

      <div>
        <label class="block text-xs uppercase font-bold text-slate-400 mb-1.5">Senha</label>
        <input type="password" id="password" required placeholder="••••••••"
               class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 transition-colors text-sm">
      </div>

      <button type="submit" id="btnSubmit"
              class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold py-3.5 rounded-xl transition-all duration-200 hover:scale-[1.02] shadow-lg shadow-emerald-500/20 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100">
        Entrar no Painel
      </button>
    </form>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const alertBox = document.getElementById('alertBox');
    const btnSubmit = document.getElementById('btnSubmit');

    let failedAttempts = 0;
    let lockTimeout = null;

    function showAlert(msg, isError = true) {
      alertBox.classList.remove('hidden', 'bg-red-500/10', 'text-red-400', 'border-red-500/20', 'bg-emerald-500/10', 'text-emerald-400', 'border-emerald-500/20');
      if (isError) {
        alertBox.classList.add('bg-red-500/10', 'text-red-400', 'border', 'border-red-500/20');
      } else {
        alertBox.classList.add('bg-emerald-500/10', 'text-emerald-400', 'border', 'border-emerald-500/20');
      }
      alertBox.innerText = msg;
    }

    function applyFrontendCooldown(seconds) {
      btnSubmit.disabled = true;
      let remaining = seconds;
      
      const updateText = () => {
        showAlert(`Acesso bloqueado por muitas tentativas. Aguarde ${remaining}s.`, true);
      };

      updateText();
      const interval = setInterval(() => {
        remaining--;
        if (remaining <= 0) {
          clearInterval(interval);
          btnSubmit.disabled = false;
          alertBox.classList.add('hidden');
          failedAttempts = 0;
        } else {
          updateText();
        }
      }, 1000);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      try {
        btnSubmit.disabled = true;
        btnSubmit.innerText = 'Autenticando...';

        const response = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok) {
          window.location.href = '/admin/dashboard.html';
        } else if (response.status === 429) {
          applyFrontendCooldown(15 * 60);
        } else {
          failedAttempts++;
          showAlert(data.error || 'Falha na autenticação.');
          
          if (failedAttempts >= 3) {
            applyFrontendCooldown(60);
          }
        }
      } catch (err) {
        showAlert('Erro de conexão com o servidor.');
      } finally {
        if (!btnSubmit.disabled) {
          btnSubmit.disabled = false;
          btnSubmit.innerText = 'Entrar no Painel';
        }
      }
    });
  </script>
</body>
</html>
