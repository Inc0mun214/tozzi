<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Tozzi Materiais</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-950 text-white p-8">

    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-yellow-500">Gestão de Catálogo (Tozzi)</h1>
            <a href="index.html" class="text-cyan-400 hover:underline"><i class="fa-solid fa-arrow-left"></i> Voltar à Loja</a>
        </div>

        <!-- Form Cadastrar / Editar -->
        <div class="bg-gray-900 p-6 rounded-xl mb-8 border border-gray-800">
            <h2 id="form-title" class="text-xl font-bold mb-4 text-cyan-400">Cadastrar Novo Produto</h2>
            <form id="product-form" onsubmit="saveProduct(event)" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <input type="hidden" id="prod-id">
                
                <input type="text" id="codigo_sku" placeholder="Código SKU (ex: EL-005)" required class="bg-gray-800 p-3 rounded-lg text-white border border-gray-700">
                <input type="text" id="nome" placeholder="Nome do Produto" required class="bg-gray-800 p-3 rounded-lg text-white border border-gray-700">
                <input type="text" id="categoria" placeholder="Categoria (Elétrica, Hidráulica...)" required class="bg-gray-800 p-3 rounded-lg text-white border border-gray-700">
                <input type="text" id="material" placeholder="Material (ex: PVC, Cobre)" class="bg-gray-800 p-3 rounded-lg text-white border border-gray-700">
                <input type="text" id="medidas" placeholder="Medidas / Dimensões" class="bg-gray-800 p-3 rounded-lg text-white border border-gray-700">
                <input type="number" step="0.01" id="preco" placeholder="Preço (R$)" required class="bg-gray-800 p-3 rounded-lg text-white border border-gray-700">
                <input type="url" id="imagem_url" placeholder="URL da Imagem" class="bg-gray-800 p-3 rounded-lg text-white border border-gray-700 col-span-2">
                
                <div class="col-span-1 flex gap-2">
                    <button type="submit" class="w-full bg-yellow-500 text-gray-950 font-bold p-3 rounded-lg hover:bg-yellow-400 transition">Salvar Produto</button>
                    <button type="button" onclick="resetForm()" class="bg-gray-700 text-white p-3 rounded-lg">Limpar</button>
                </div>
            </form>
        </div>

        <!-- Tabela REST CRUD -->
        <div class="bg-gray-900 rounded-xl overflow-hidden border border-gray-800">
            <table class="w-full text-left text-sm text-gray-300">
                <thead class="bg-gray-800 text-gray-400 uppercase text-xs">
                    <tr>
                        <th class="p-4">SKU</th>
                        <th class="p-4">Nome</th>
                        <th class="p-4">Categoria</th>
                        <th class="p-4">Preço</th>
                        <th class="p-4 text-right">Ações</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Preenchido via AJAX -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const fetchTableData = async () => {
            try {
                const res = await fetch('/api/produtos');
                const data = await res.json();
                const tbody = document.getElementById('table-body');
                tbody.innerHTML = data.map(p => `
                    <tr class="border-b border-gray-800 hover:bg-gray-800/50">
                        <td class="p-4 font-mono">${p.codigo_sku}</td>
                        <td class="p-4 font-bold text-white">${p.nome}</td>
                        <td class="p-4">${p.categoria}</td>
                        <td class="p-4 text-yellow-500 font-bold">R$ ${parseFloat(p.preco).toFixed(2)}</td>
                        <td class="p-4 text-right space-x-2">
                            <button onclick='editProduct(${JSON.stringify(p)})' class="text-cyan-400 hover:text-cyan-300"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button onclick="deleteProduct(${p.id})" class="text-red-500 hover:text-red-400"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error('Erro ao carregar lista de produtos', err);
            }
        };

        const saveProduct = async (e) => {
            e.preventDefault();
            const id = document.getElementById('prod-id').value;
            const payload = {
                codigo_sku: document.getElementById('codigo_sku').value,
                nome: document.getElementById('nome').value,
                categoria: document.getElementById('categoria').value,
                material: document.getElementById('material').value,
                medidas: document.getElementById('medidas').value,
                preco: parseFloat(document.getElementById('preco').value.replace(',', '.')),
                imagem_url: document.getElementById('imagem_url').value
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `/api/produtos/${id}` : '/api/produtos';

            await fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            resetForm();
            fetchTableData();
        };

        const editProduct = (p) => {
            document.getElementById('prod-id').value = p.id;
            document.getElementById('codigo_sku').value = p.codigo_sku;
            document.getElementById('nome').value = p.nome;
            document.getElementById('categoria').value = p.categoria;
            document.getElementById('material').value = p.material || '';
            document.getElementById('medidas').value = p.medidas || '';
            document.getElementById('preco').value = p.preco;
            document.getElementById('imagem_url').value = p.imagem_url || '';
            document.getElementById('form-title').innerText = 'Editar Produto';
        };

        const deleteProduct = async (id) => {
            if(confirm('Deseja realmente excluir este item?')) {
                await fetch(`/api/produtos/${id}`, { method: 'DELETE' });
                fetchTableData();
            }
        };

        const resetForm = () => {
            document.getElementById('product-form').reset();
            document.getElementById('prod-id').value = '';
            document.getElementById('form-title').innerText = 'Cadastrar Novo Produto';
        };

        window.onload = fetchTableData;
    </script>
</body>
</html>
