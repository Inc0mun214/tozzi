<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Produtos | Painel Administrativo</title>
  
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              neon: '#00FF66',
              dark: '#0A0D0B',
              card: '#121714',
              border: '#1E2620',
              muted: '#8F9E94'
            }
          }
        }
      }
    }
  </script>
  
  <style>
    body {
      background-color: #0A0D0B;
      color: #E2E8F0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .glass-panel {
      background: rgba(18, 23, 20, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 255, 102, 0.12);
    }
    .glass-input {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #FFFFFF;
    }
    .glass-input:focus {
      border-color: #00FF66;
      box-shadow: 0 0 12px rgba(0, 255, 102, 0.2);
      outline: none;
    }
  </style>
</head>
<body class="min-h-screen pb-12">

  <!-- Header -->
  <header class="border-b border-brand-border bg-brand-dark/80 sticky top-0 z-40 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-brand-neon/10 border border-brand-neon/30 flex items-center justify-center">
          <i data-lucide="package" class="w-5 h-5 text-brand-neon"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold text-white tracking-wide">Painel de Gestão</h1>
          <p class="text-xs text-brand-muted">Gerenciamento de Catálogo e Estoque</p>
        </div>
      </div>
      <a href="/index.html" class="flex items-center space-x-2 text-xs text-brand-muted hover:text-brand-neon transition-colors border border-white/10 px-4 py-2 rounded-xl bg-white/5">
        <i data-lucide="external-link" class="w-4 h-4"></i>
        <span>Ver Loja</span>
      </a>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
    
    <!-- Form Coluna Esquerda (Criar / Editar) -->
    <section class="lg:col-span-4">
      <div class="glass-panel p-6 rounded-2xl sticky top-28">
        <div class="flex items-center justify-between mb-6 pb-4 border-b border-white/5">
          <h2 id="formTitle" class="text-lg font-bold text-white flex items-center gap-2">
            <i data-lucide="plus-circle" class="w-5 h-5 text-brand-neon"></i>
            Novo Produto
          </h2>
          <button id="btnCancelEdit" onclick="limparFormulario()" class="hidden text-xs text-brand-muted hover:text-red-400">
            Cancelar
          </button>
        </div>

        <form id="productForm" class="space-y-4">
          <input type="hidden" id="productId">

          <div>
            <label class="block text-xs font-mono text-brand-muted uppercase mb-1">Nome do Produto</label>
            <input type="text" id="nome" required placeholder="Ex: Tecido Calandra Pro" class="w-full glass-input rounded-xl px-4 py-2.5 text-sm">
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-mono text-brand-muted uppercase mb-1">Categoria</label>
              <input type="text" id="categoria" required placeholder="Ex: Premium" class="w-full glass-input rounded-xl px-4 py-2.5 text-sm">
            </div>
            <div>
              <label class="block text-xs font-mono text-brand-muted uppercase mb-1">Preço (R$)</label>
              <input type="number" step="0.01" id="preco" required placeholder="0.00" class="w-full glass-input rounded-xl px-4 py-2.5 text-sm">
            </div>
          </div>

          <div>
            <label class="block text-xs font-mono text-brand-muted uppercase mb-1">URL da Imagem</label>
            <input type="url" id="imagem" placeholder="https://..." class="w-full glass-input rounded-xl px-4 py-2.5 text-sm">
          </div>

          <div>
            <label class="block text-xs font-mono text-brand-muted uppercase mb-1">Descrição</label>
            <textarea id="descricao" rows="3" placeholder="Detalhes do produto..." class="w-full glass-input rounded-xl px-4 py-2.5 text-sm resize-none"></textarea>
          </div>

          <button type="submit" id="btnSubmit" class="w-full py-3 bg-brand-neon text-black font-bold text-sm rounded-xl hover:bg-brand-neon/90 transition-all shadow-lg shadow-brand-neon/20 flex items-center justify-center gap-2 mt-4">
            <i data-lucide="save" class="w-4 h-4"></i>
            <span>Salvar Produto</span>
          </button>
        </form>
      </div>
    </section>

    <!-- Tabela Coluna Direita (Listagem CRUD) -->
    <section class="lg:col-span-8">
      <div class="glass-panel p-6 rounded-2xl">
        <div class="flex items-center justify-between mb-6 pb-4 border-b border-white/5">
          <h2 class="text-lg font-bold text-white flex items-center gap-2">
            <i data-lucide="layers" class="w-5 h-5 text-brand-neon"></i>
            Catálogo Cadastrado
          </h2>
          <span id="totalBadge" class="text-xs font-mono bg-brand-neon/10 text-brand-neon border border-brand-neon/20 px-3 py-1 rounded-full">
            0 itens
          </span>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="border-b border-white/10 text-[11px] font-mono text-brand-muted uppercase tracking-wider">
                <th class="pb-3 px-2">Item</th>
                <th class="pb-3 px-2">Categoria</th>
                <th class="pb-3 px-2">Preço</th>
                <th class="pb-3 px-2 text-right">Ações</th>
              </tr>
            </thead>
            <tbody id="productsTableBody" class="divide-y divide-white/5 text-sm">
              <!-- Renderizado via JavaScript -->
              <tr>
                <td colspan="4" class="py-8 text-center text-brand-muted">Carregando produtos...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>

  </main>

  <script>
    lucide.createIcons();

    // Buscar e Renderizar Produtos
    async function carregarProdutos() {
      try {
        const res = await fetch('/api/produtos');
        const produtos = await res.json();
        
        const tbody = document.getElementById('productsTableBody');
        document.getElementById('totalBadge').textContent = `${produtos.length} itens`;
        tbody.innerHTML = '';

        if (!produtos || produtos.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="4" class="py-8 text-center text-brand-muted">Nenhum produto cadastrado no banco.</td>
            </tr>`;
          return;
        }

        produtos.forEach(p => {
          const tr = document.createElement('tr');
          tr.className = "hover:bg-white/[0.02] transition-colors";
          tr.innerHTML = `
            <td class="py-4 px-2">
              <div class="flex items-center space-x-3">
                <img src="${p.imagem || p.imagem_url || 'https://via.placeholder.com/80'}" alt="${p.nome}" class="w-10 h-10 rounded-lg object-cover border border-white/10">
                <div>
                  <div class="font-bold text-white">${p.nome}</div>
                  <div class="text-xs text-brand-muted line-clamp-1">${p.descricao || 'Sem descrição'}</div>
                </div>
              </div>
            </td>
            <td class="py-4 px-2">
              <span class="text-xs font-mono bg-white/5 border border-white/10 text-white px-2.5 py-1 rounded-md">
                ${p.categoria}
              </span>
            </td>
            <td class="py-4 px-2 font-mono font-bold text-brand-neon">
              R$ ${parseFloat(p.preco).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}
            </td>
            <td class="py-4 px-2 text-right space-x-2">
              <button onclick="editarProduto(${p.id})" class="p-2 rounded-lg bg-white/5 border border-white/10 hover:border-brand-neon hover:text-brand-neon transition-all" title="Editar">
                <i data-lucide="pencil" class="w-4 h-4"></i>
              </button>
              <button onclick="deletarProduto(${p.id})" class="p-2 rounded-lg bg-white/5 border border-white/10 hover:border-red-500 hover:text-red-500 transition-all" title="Excluir">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </td>
          `;
          tbody.appendChild(tr);
        });

        lucide.createIcons();
      } catch (err) {
        console.error('Erro ao buscar produtos:', err);
      }
    }

    // Criar / Editar (Submit Form)
    document.getElementById('productForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const id = document.getElementById('productId').value;
      const payload = {
        nome: document.getElementById('nome').value,
        categoria: document.getElementById('categoria').value,
        preco: parseFloat(document.getElementById('preco').value),
        imagem: document.getElementById('imagem').value,
        descricao: document.getElementById('descricao').value
      };

      const url = id ? `/api/produtos/${id}` : '/api/produtos';
      const method = id ? 'PUT' : 'POST';

      try {
        const res = await fetch(url, {
          method: method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          limparFormulario();
          carregarProdutos();
        } else {
          alert('Erro ao processar a requisição no servidor.');
        }
      } catch (err) {
        console.error('Erro ao salvar produto:', err);
      }
    });

    // Editar Produto
    async function editarProduto(id) {
      try {
        const res = await fetch('/api/produtos');
        const produtos = await res.json();
        const p = produtos.find(item => item.id === id);

        if (p) {
          document.getElementById('productId').value = p.id;
          document.getElementById('nome').value = p.nome;
          document.getElementById('categoria').value = p.categoria;
          document.getElementById('preco').value = p.preco;
          document.getElementById('imagem').value = p.imagem || p.imagem_url || '';
          document.getElementById('descricao').value = p.descricao || '';

          document.getElementById('formTitle').innerHTML = `<i data-lucide="pencil" class="w-5 h-5 text-brand-neon"></i> Editar Produto`;
          document.getElementById('btnSubmit').querySelector('span').textContent = 'Atualizar Produto';
          document.getElementById('btnCancelEdit').classList.remove('hidden');
          
          lucide.createIcons();
        }
      } catch (err) {
        console.error('Erro ao carregar dados do produto:', err);
      }
    }

    // Deletar Produto
    async function deletarProduto(id) {
      if (!confirm('Deseja realmente remover este produto do catálogo?')) return;

      try {
        const res = await fetch(`/api/produtos/${id}`, { method: 'DELETE' });
        if (res.ok) {
          carregarProdutos();
        } else {
          alert('Erro ao excluir produto.');
        }
      } catch (err) {
        console.error('Erro ao deletar produto:', err);
      }
    }

    // Limpar Formulário
    function limparFormulario() {
      document.getElementById('productId').value = '';
      document.getElementById('productForm').reset();
      document.getElementById('formTitle').innerHTML = `<i data-lucide="plus-circle" class="w-5 h-5 text-brand-neon"></i> Novo Produto`;
      document.getElementById('btnSubmit').querySelector('span').textContent = 'Salvar Produto';
      document.getElementById('btnCancelEdit').classList.add('hidden');
      lucide.createIcons();
    }

    document.addEventListener('DOMContentLoaded', carregarProdutos);
  </script>
</body>
</html>
