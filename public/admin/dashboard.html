<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Controle - Tozzi Materiais Elétricos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header Administrativo -->
  <header class="bg-slate-950 border-b border-slate-800 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="bg-amber-500 text-slate-950 font-black text-xl px-3 py-1.5 rounded-lg">TOZZI</div>
        <div>
          <h1 class="font-bold text-lg leading-none text-white">Painel Administrativo</h1>
          <p class="text-xs text-slate-400">Cerquilho - SP</p>
        </div>
      </div>

      <div class="flex items-center gap-4">
        <span id="userBadge" class="hidden sm:inline text-sm text-slate-300 font-medium">
          <i class="fa-solid fa-user-circle text-amber-500"></i> Admin
        </span>
        <a href="/" target="_blank" class="text-xs text-slate-400 hover:text-white transition-colors flex items-center gap-1">
          <i class="fa-solid fa-external-link"></i> Ver Loja
        </a>
        <button id="logoutBtn" class="bg-slate-800 hover:bg-red-600/80 text-slate-300 hover:text-white text-xs font-bold px-3 py-2 rounded-lg transition-colors flex items-center gap-2">
          <i class="fa-solid fa-right-from-bracket"></i> Sair
        </button>
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
    
    <!-- Barra Superior de Ações -->
    <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4 mb-6">
      <div>
        <h2 class="text-2xl font-bold text-white">Gerenciamento de Produtos</h2>
        <p class="text-xs text-slate-400">Cadastre, edite ou remova itens do catálogo virtual.</p>
      </div>
      <button id="openModalBtn" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2.5 rounded-lg flex items-center justify-center gap-2 transition-colors">
        <i class="fa-solid fa-plus"></i> Novo Produto
      </button>
    </div>

    <!-- Tabela de Produtos -->
    <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden shadow-xl">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-950 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-700">
              <th class="p-4">Produto</th>
              <th class="p-4">Categoria</th>
              <th class="p-4">Preço</th>
              <th class="p-4">Estoque</th>
              <th class="p-4 text-center">Destaque</th>
              <th class="p-4 text-right">Ações</th>
            </tr>
          </thead>
          <tbody id="productsTableBody" class="divide-y divide-slate-700/50 text-sm">
            <!-- Renderização Dinâmica via JS -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal Cadastrar / Editar Produto -->
  <div id="productModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm hidden">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-xl rounded-xl shadow-2xl overflow-hidden">
      <div class="p-5 border-b border-slate-700 flex justify-between items-center bg-slate-950">
        <h3 id="modalTitle" class="font-bold text-lg text-white">Novo Produto</h3>
        <button id="closeModalBtn" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <form id="productForm" class="p-6 space-y-4">
        <input type="hidden" id="productId">

        <div>
          <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Nome do Produto</label>
          <input type="text" id="pName" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Categoria</label>
            <select id="pCategory" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500">
              <option value="fios_e_cabos">Fios e Cabos</option>
              <option value="iluminacao">Iluminação</option>
              <option value="disjuntores_e_quadros">Disjuntores e Quadros</option>
              <option value="ferramentas">Ferramentas Elétricas</option>
            </select>
          </div>

          <div>
            <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Preço (R$)</label>
            <input type="number" step="0.01" id="pPrice" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Estoque</label>
            <input type="number" id="pStock" value="0" min="0" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500">
          </div>

          <div class="flex items-center pt-5">
            <label class="inline-flex items-center cursor-pointer">
              <input type="checkbox" id="pFeatured" class="sr-only peer">
              <div class="w-11 h-6 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-amber-500"></div>
              <span class="ml-3 text-sm font-medium text-slate-300">Destaque na Loja</span>
            </label>
          </div>
        </div>

        <div>
          <label class="block text-xs uppercase font-bold text-slate-400 mb-1">URL da Imagem</label>
          <input type="url" id="pImage" placeholder="https://exemplo.com/imagem.jpg" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500">
        </div>

        <div>
          <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Descrição</label>
          <textarea id="pDescription" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500"></textarea>
        </div>

        <div class="flex justify-end gap-3 pt-4 border-t border-slate-700">
          <button type="button" id="cancelModalBtn" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-bold text-slate-200">Cancelar</button>
          <button type="submit" class="px-4 py-2 bg-amber-500 hover:bg-amber-600 rounded-lg text-sm font-bold text-slate-950">Salvar Produto</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Validação de Sessão Inicial
    async function checkAuth() {
      try {
        const res = await fetch('/api/admin/check');
        const data = await res.json();
        if (!data.authenticated) {
          window.location.href = '/admin/index.html';
        } else {
          document.getElementById('userBadge').innerText = `👤 ${data.user.username}`;
        }
      } catch (err) {
        window.location.href = '/admin/index.html';
      }
    }

    // Elementos DOM
    const tableBody = document.getElementById('productsTableBody');
    const modal = document.getElementById('productModal');
    const productForm = document.getElementById('productForm');

    // Carregar Produtos
    async function loadProducts() {
      try {
        const res = await fetch('/api/admin/products');
        if (res.status === 401) return window.location.href = '/admin/index.html';
        
        const products = await res.json();

        if (products.length === 0) {
          tableBody.innerHTML = `
            <tr>
              <td colspan="6" class="p-8 text-center text-slate-500">Nenhum produto cadastrado no momento.</td>
            </tr>
          `;
          return;
        }

        tableBody.innerHTML = products.map(p => `
          <tr class="hover:bg-slate-700/30 transition-colors">
            <td class="p-4 flex items-center gap-3">
              <img src="${p.image_url || 'https://via.placeholder.com/50'}" class="w-10 h-10 object-cover rounded bg-slate-900 border border-slate-700">
              <div>
                <div class="font-bold text-white">${p.name}</div>
                <div class="text-xs text-slate-400 line-clamp-1">${p.description || '-'}</div>
              </div>
            </td>
            <td class="p-4 text-slate-300">${p.category_slug}</td>
            <td class="p-4 font-bold text-amber-500">R$ ${parseFloat(p.price).toFixed(2)}</td>
            <td class="p-4 text-slate-300">${p.stock} un.</td>
            <td class="p-4 text-center">
              ${p.featured ? '<span class="bg-amber-500/10 text-amber-400 border border-amber-500/20 text-xs px-2 py-1 rounded font-bold">Sim</span>' : '<span class="text-slate-500 text-xs">Não</span>'}
            </td>
            <td class="p-4 text-right space-x-2">
              <button onclick="editProduct(${p.id})" class="text-slate-400 hover:text-amber-500 transition-colors"><i class="fa-solid fa-pen-to-square"></i></button>
              <button onclick="deleteProduct(${p.id})" class="text-slate-400 hover:text-red-500 transition-colors"><i class="fa-solid fa-trash"></i></button>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        console.error('Erro ao carregar produtos:', err);
      }
    }

    // Modal Handlers
    function openModal(isEdit = false) {
      document.getElementById('modalTitle').innerText = isEdit ? 'Editar Produto' : 'Novo Produto';
      modal.classList.remove('hidden');
    }

    function closeModal() {
      modal.classList.add('hidden');
      productForm.reset();
      document.getElementById('productId').value = '';
    }

    document.getElementById('openModalBtn').addEventListener('click', () => openModal(false));
    document.getElementById('closeModalBtn').addEventListener('click', closeModal);
    document.getElementById('cancelModalBtn').addEventListener('click', closeModal);

    // Salvar / Atualizar Produto
    productForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('productId').value;
      
      const payload = {
        name: document.getElementById('pName').value,
        category_slug: document.getElementById('pCategory').value,
        price: parseFloat(document.getElementById('pPrice').value),
        stock: parseInt(document.getElementById('pStock').value, 10),
        featured: document.getElementById('pFeatured').checked,
        image_url: document.getElementById('pImage').value,
        description: document.getElementById('pDescription').value
      };

      const url = id ? `/api/admin/products/${id}` : '/api/admin/products';
      const method = id ? 'PUT' : 'POST';

      try {
        const res = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          closeModal();
          loadProducts();
        } else {
          alert('Erro ao salvar produto.');
        }
      } catch (err) {
        alert('Erro de conexão com o servidor.');
      }
    });

    // Preencher edição
    window.editProduct = async function(id) {
      try {
        const res = await fetch('/api/admin/products');
        const products = await res.json();
        const p = products.find(prod => prod.id === id);

        if (p) {
          document.getElementById('productId').value = p.id;
          document.getElementById('pName').value = p.name;
          document.getElementById('pCategory').value = p.category_slug;
          document.getElementById('pPrice').value = p.price;
          document.getElementById('pStock').value = p.stock;
          document.getElementById('pFeatured').checked = p.featured;
          document.getElementById('pImage').value = p.image_url || '';
          document.getElementById('pDescription').value = p.description || '';

          openModal(true);
        }
      } catch (err) {
        alert('Erro ao carregar dados do produto.');
      }
    };

    // Excluir Produto
    window.deleteProduct = async function(id) {
      if (!confirm('Tem certeza que deseja excluir este produto?')) return;

      try {
        const res = await fetch(`/api/admin/products/${id}`, { method: 'DELETE' });
        if (res.ok) {
          loadProducts();
        } else {
          alert('Erro ao remover produto.');
        }
      } catch (err) {
        alert('Erro na requisição.');
      }
    };

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/admin/logout', { method: 'POST' });
      window.location.href = '/admin/index.html';
    });

    // Start
    checkAuth();
    loadProducts();
  </script>
</body>
</html>
