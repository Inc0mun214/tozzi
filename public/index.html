<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tozzi Materiais Elétricos | Cerquilho-SP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-slate-950 border-b border-slate-800 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="bg-amber-500 text-slate-950 font-black text-xl px-3 py-1.5 rounded-lg">TOZZI</div>
        <div>
          <h1 class="font-bold text-lg leading-none text-white">Materiais Elétricos</h1>
          <p class="text-xs text-amber-500 font-medium"><i class="fa-solid fa-location-dot"></i> Cerquilho - SP</p>
        </div>
      </div>

      <!-- Barra de Pesquisa -->
      <div class="flex-1 max-w-md min-w-[280px]">
        <div class="relative">
          <input type="text" id="searchInput" placeholder="Buscar fios, lâmpadas, disjuntores..." 
                 class="w-full bg-slate-900 border border-slate-700 rounded-lg pl-10 pr-4 py-2 text-sm text-white focus:outline-none focus:border-amber-500 transition-colors">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-sm"></i>
        </div>
      </div>

      <!-- Carrinho Button -->
      <button id="openCartBtn" class="relative bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2 rounded-lg flex items-center gap-2 transition-colors">
        <i class="fa-solid fa-cart-shopping"></i>
        <span class="hidden sm:inline">Carrinho</span>
        <span id="cartBadge" class="bg-slate-950 text-amber-500 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
      </button>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
    
    <!-- Categorias / Filtros -->
    <div class="flex items-center gap-2 overflow-x-auto pb-4 mb-6 scrollbar-none" id="categoriesContainer">
      <button data-slug="all" class="category-btn bg-amber-500 text-slate-950 font-bold px-4 py-2 rounded-full text-sm whitespace-nowrap transition-colors">
        Todos os Produtos
      </button>
    </div>

    <!-- Grid de Produtos -->
    <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- Inserção Dinâmica via JS -->
    </div>
  </main>

  <!-- Drawer do Carrinho -->
  <div id="cartDrawer" class="fixed inset-0 z-50 pointer-events-none">
    <div id="cartOverlay" class="absolute inset-0 bg-slate-950/80 opacity-0 transition-opacity duration-300"></div>
    <aside id="cartSidebar" class="absolute right-0 top-0 h-full w-full max-w-md bg-slate-900 border-l border-slate-800 p-6 flex flex-col transform translate-x-full transition-transform duration-300 pointer-events-auto">
      <div class="flex items-center justify-between pb-4 border-b border-slate-800">
        <h2 class="text-lg font-bold flex items-center gap-2"><i class="fa-solid fa-cart-shopping text-amber-500"></i> Seu Carrinho</h2>
        <button id="closeCartBtn" class="text-slate-400 hover:text-white p-2 text-lg"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div id="cartItems" class="flex-1 overflow-y-auto py-4 space-y-4">
        <!-- Itens do Carrinho via JS -->
      </div>

      <div class="border-t border-slate-800 pt-4 space-y-4">
        <div>
          <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Método de Envio / Retirada</label>
          <select id="deliveryMethod" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
            <option value="Retirada na Loja (Cerquilho-SP)">Retirar na Loja (Cerquilho-SP)</option>
            <option value="Entrega em Cerquilho-SP">Entrega em Domicílio (Cerquilho-SP)</option>
          </select>
        </div>

        <div id="addressField" class="hidden">
          <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Endereço de Entrega em Cerquilho</label>
          <input type="text" id="customerAddress" placeholder="Rua, número e bairro" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
        </div>

        <div class="flex justify-between items-center text-lg font-bold">
          <span>Total:</span>
          <span id="cartTotal" class="text-amber-500">R$ 0,00</span>
        </div>

        <button id="checkoutBtn" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded-lg flex items-center justify-center gap-2 transition-colors">
          <i class="fa-brands fa-whatsapp text-xl"></i> Finalizar no WhatsApp
        </button>
      </div>
    </aside>
  </div>

  <script src="/js/main.js"></script>
</body>
</html>
